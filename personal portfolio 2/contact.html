<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personl Portfolio</title>
    <link rel="stylesheet" href="contact.css" />
  </head>
  <body>
    <div class="container">
      <div class="sidebar sidebargo">
        <nav>
          <!-- <ul>
            <li><a href="/personl portfolio 2/contact.html"></a></li>
          </ul> -->
        </nav>
      </div>
      <div class="main">
        <div class="hamburger">
        </div>
        <div class="contactform">
          <h1>Contact me for work/General Enquiries</h1>
          <form>
            <div class="mb-3">
              <label for="clientemail" class="form-label">Name</label>
              <input
                type="email"
                class="form-control"
                id="clientemail"
                aria-describedby="emailHelp"
              />
              <!-- <div id="emailHelp" class="form-text">We'll never share your email & phone with anyone else.</div> -->
            </div>
            <div class="mb-3">
              <label for="clientphone" class="form-label">Email address</label>
              <input type="Phone" class="form-control" id="clientphone" />
              <div id="emailHelp" class="form-text">
                We'll never share your email & phone with anyone else.
              </div>
            </div>
            <div class="mb-3">
              <label for="clientemail" class="form-label">Phone</label>
              <input
                type="email"
                class="form-control"
                id="clientemail"
                aria-describedby="emailHelp"
              />
              <!-- <div id="emailHelp" class="form-text">We'll never share your email & phone with anyone else.</div> -->
            </div>
            <div class="mb-3">
              <label for="clientphone" class="form-label">Enquiry</label>
              <input type="Phone" class="form-control" id="clientphone" />
            </div>
            <div class="mb-3" id="form-check">
              <input type="checkbox" class="form-check-input" id="isclient" />
              <label class="form-check-label" for="isclient"
                >I want you to work on a project with me</label
              >
            </div>
              <button type="submit" class="btn">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
